<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hadis Random</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#151515;font-family:Arial,sans-serif}
.wrap{max-width:820px;margin:50px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:30px;box-shadow:0 4px 25px #0001}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #eee;padding-bottom:18px;margin-bottom:22px}
.kitab{font-weight:700;font-size:18px}.meta{color:#777;font-size:14px;margin-top:6px}
.badge{background:#e9f7ed;color:#18743b;padding:7px 11px;border-radius:20px;font-size:13px;font-weight:bold}
.bab{font-size:22px;line-height:1.45;margin:0 0 20px}.arab{font-family:"Times New Roman",serif;font-size:30px;line-height:2.1;text-align:right;direction:rtl;margin:25px 0}
.trans{font-size:16px;line-height:1.8;color:#444}.source{margin-top:18px;font-size:12px;color:#999}
button{width:100%;margin-top:25px;padding:15px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}.status{text-align:center;color:#777;font-size:13px;margin-top:12px}.error{color:#c00}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="top">
    <div><div id="kitab" class="kitab">Hadis Random</div><div id="meta" class="meta">Memuat...</div></div>
    <div id="statusHadis" class="badge">—</div>
  </div>
  <h1 id="bab" class="bab">—</h1>
  <div id="arab" class="arab">—</div>
  <div id="trans" class="trans">—</div>
  <div id="source" class="source"></div>
  <button id="btn" onclick="randomHadis()">HADIS RANDOM</button>
  <div id="status" class="status"></div>
</div></div>

<script>
const API = "GANTI_DENGAN_URL_WORKER_KAMU";

const BOOKS=[
  ["bukhari","Shahih Al-Bukhari",7438],
  ["muslim","Shahih Muslim",3100],
  ["abu-dawud","Sunan Abu Dawud",5274],
  ["tirmidzi","Jami' At-Tirmidzi",3956],
  ["nasai","Sunan An-Nasa'i",5758],
  ["ibnu-majah","Sunan Ibnu Majah",4341],
  ["ahmad","Musnad Ahmad",27647]
];

async function randomHadis(){
  const btn=document.getElementById("btn"), status=document.getElementById("status");
  btn.disabled=true; status.textContent="Mengambil hadis acak...";
  try{
    let data=null;
    for(let attempt=0;attempt<12 && !data;attempt++){
      const book=BOOKS[Math.floor(Math.random()*BOOKS.length)];
      const no=Math.floor(Math.random()*book[2])+1;
      const target=`https://www.hadits.id/hadits/${book[0]}/${no}`;
      const r=await fetch(API+"/scrape?url="+encodeURIComponent(target));
      if(!r.ok) continue;
      const j=await r.json();
      if(!j.html) continue;
      data=parseHadis(j.html,book,no,target);
    }
    if(!data) throw new Error("Hadis tidak ditemukan. Coba lagi.");
    render(data);
    status.textContent="";
  }catch(e){status.innerHTML='<span class="error">'+escapeHtml(e.message)+'</span>'}
  finally{btn.disabled=false}
}

function parseHadis(source,book,no,url){
  const doc=new DOMParser().parseFromString(source,"text/html");
  const body=doc.body;
  const text=body.innerText.replace(/\r/g,"");
  const lines=text.split("\n").map(x=>x.trim()).filter(Boolean);

  // Struktur halaman Hadits.id yang terbaca:
  // kitab · bab · No, lalu judul bab, status, Arab, transliterasi, terjemahan.
  const marker=lines.findIndex(x=>/·\s*No\.\s*\d+/.test(x));
  if(marker<0) return null;

  let kitab=lines[marker].split("·")[0].trim() || book[1];
  let meta=lines[marker];
  let title=lines[marker+1]||"Hadis";
  let statusIdx=marker+2;
  let hadStatus=lines[statusIdx]||"";
  if(!/^(Shahih|Hasan|Dhaif|Hasan Shahih)/i.test(hadStatus)){
    hadStatus="";
    statusIdx=marker+1;
  }

  // Cari blok Arab berdasarkan karakter Arab dan panjang teks.
  let arab="";
  let arabIdx=-1;
  for(let i=statusIdx+1;i<Math.min(lines.length,statusIdx+30);i++){
    if(hasArabic(lines[i]) && lines[i].length>40){
      arab=lines[i]; arabIdx=i; break;
    }
  }
  if(!arab) return null;

  // Setelah Arab biasanya transliterasi lalu terjemahan.
  let translation="";
  for(let i=arabIdx+1;i<Math.min(lines.length,arabIdx+8);i++){
    const s=lines[i];
    if(s.length>80 && !/^(Selengkapnya|Sembunyikan|Simpan|Penjelasan)/i.test(s)){
      if(!hasArabic(s)){translation=s; break}
    }
  }

  // Bila ada dua blok Latin, ambil blok terpanjang setelah transliterasi.
  if(!translation){
    const candidates=lines.slice(arabIdx+1,arabIdx+10).filter(s=>s.length>50&&!hasArabic(s));
    translation=candidates.sort((a,b)=>b.length-a.length)[0]||"";
  }

  return {kitab,meta,title,hadStatus,arab,translation,url};
}

function render(d){
  document.getElementById("kitab").textContent=d.kitab;
  document.getElementById("meta").textContent=d.meta;
  document.getElementById("statusHadis").textContent=d.hadStatus||"Hadis";
  document.getElementById("bab").textContent=d.title;
  document.getElementById("arab").textContent=d.arab;
  document.getElementById("trans").textContent=d.translation||"Terjemahan tidak ditemukan.";
  document.getElementById("source").textContent=d.url;
}
function hasArabic(s){return /[\u0600-\u06FF]/.test(s)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
randomHadis();
</script>
</body>
</html>
